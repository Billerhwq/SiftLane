name: P2 acceptance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: p2-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: acceptance
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Run lifecycle and release metadata gates
        shell: pwsh
        run: .\scripts\verify.ps1 -Install -BrowserChannel chrome

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-acceptance-evidence-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            outputs/*.png
            apps/web/playwright-report/
            apps/web/test-results/

  linux-deployment:
    name: linux deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and start hardened Compose deployment
        working-directory: engine
        env:
          SIFTLANE_ENGINE_BOOTSTRAP_ADMIN_PASSWORD: Linux-ci-password-123
          SIFTLANE_ENGINE_SECRET_KEY: linux-ci-engine-secret-key-32-characters-long
        run: docker compose up --build --wait --wait-timeout 180 --detach

      - name: Verify health, persistence boundary and Web console
        run: |
          curl --fail http://127.0.0.1:8090/health/live
          curl --fail http://127.0.0.1:8090/health/ready
          curl --fail http://127.0.0.1:8080/
          docker compose -f engine/compose.yaml ps

      - name: Preserve container logs
        if: always()
        working-directory: engine
        run: docker compose logs --no-color > ../linux-compose.log

      - name: Stop deployment
        if: always()
        working-directory: engine
        run: docker compose down --volumes

      - name: Upload Linux deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-deployment-${{ github.run_attempt }}
          path: linux-compose.log
