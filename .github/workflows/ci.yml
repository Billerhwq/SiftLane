name: P2 acceptance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: p2-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: acceptance
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Run P1, P2, and release metadata gates
        shell: pwsh
        run: .\scripts\verify.ps1 -Install -BrowserChannel chrome

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-acceptance-evidence-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            outputs/*.png
            apps/web/playwright-report/
            apps/web/test-results/
