name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  acceptance:
    name: acceptance
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  package:
    name: package and publish
    needs: acceptance
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build and smoke-test release artifacts
        shell: pwsh
        run: .\scripts\package-release.ps1 -Install -Tag $env:RELEASE_TAG

      - name: Preserve release candidate
        uses: actions/upload-artifact@v4
        with:
          name: siftlane-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 30
          path: release-artifacts/*

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath release-artifacts -File | ForEach-Object FullName
          gh release create $env:RELEASE_TAG $assets --verify-tag --title "Siftlane $env:RELEASE_TAG" --notes-file "documentation/releases/$env:RELEASE_TAG.md"
