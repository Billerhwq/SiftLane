[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "siftlane-engine"
version = "1.0.0"
description = "Isolated, durable workflow crawler engine for Siftlane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.21,<1",
  "beautifulsoup4>=4.13,<5",
  "croniter>=6,<7",
  "cryptography>=48.0.1,<49",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "pydantic-settings>=2.10,<3",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "hatchling>=1.27,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pip-audit>=2.9,<3",
]

[project.scripts]
siftlane-engine = "siftlane_engine.main:main"
siftlane-ops = "siftlane_engine.operations:main"

[tool.hatch.build.targets.wheel]
packages = ["src/siftlane_engine", "src/siftlane_connector_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
